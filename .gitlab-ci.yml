# ── Added Phase 3: unit tests for the pure pipeline helpers.
unit-test:
  stage: test
  image: python:3.11
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    - python -m pytest -q
