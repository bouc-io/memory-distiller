include:
  - template: SAST.gitlab-ci.yml
  - template: Secret-Detection.gitlab-ci.yml
  - template: Dependency-Scanning.gitlab-ci.yml
  # Shared lint + unit-test jobs. Private project: the identity running the pipeline
  # needs at least Reporter on bouc-io/ci-templates or the include fails to resolve.
  - project: 'bouc-io/ci-templates'
    ref: main
    file: '/python.yml'

stages:
  - build
  - test
#  - deploy

variables:
  VERSION: "1.0.${CI_PIPELINE_ID}"
  DOCKER_TLS_CERTDIR: "/certs"

docker-build:
  image: docker:24.0.5
  stage: build
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    # WORKAROUND (added 2026-08-30) for "blob unknown to registry" on push.
    # Since BuildKit v0.32.0 the default attestation manifest is an OCI artifact
    # whose `subject` points at the image manifest, and BuildKit pushes it before
    # that subject exists. GitLab's registry enforces referential integrity and
    # rejects it with "blob unknown to registry - <subject digest>". Only fires
    # when the image manifest is new to the registry, so it looks intermittent.
    #   https://github.com/moby/buildkit/issues/7007
    #   https://gitlab.com/gitlab-org/gitlab/-/work_items/209008
    # REMOVE WHEN: verified unnecessary against the builder pinned below. The
    # v0.32.1 fix (moby/buildkit#7012) is already in the pinned v0.32.2, so this
    # variable may well be redundant, but that was never tested: every green
    # pipeline since 2026-08-30 has run with it set. To check, delete it and
    # confirm a build with genuinely new content still pushes cleanly. Note that
    # a CI-only edit does not change image content, so it will not exercise the
    # push path this guards.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker run --rm --privileged multiarch/qemu-user-static:7.2.0-1 --reset -p yes
    - docker context create buildercontext
    - docker buildx create buildercontext --name mybuilder --driver-opt image=moby/buildkit:v0.32.2 --use
  script:
    - |
      TAGS="-t $DOCKER_IMAGE_NAME"
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        TAGS="$TAGS -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$VERSION"
      fi
      docker buildx build --builder=mybuilder --platform linux/amd64,linux/arm64 \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max \
        --push $TAGS .
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - Dockerfile

